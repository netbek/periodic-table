allowBuilds:
  "@parcel/watcher@2.6.0": true
  "chrys@5.2.1": true
  "es5-ext@0.10.64": true
  "esbuild@0.28.2": true

blockExoticSubdeps: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "chrys@5.2.1"

# Create flat node_modules without symlinks. This is a workaround for chrys@5.2.1 postinstall script
# that fails without a specific error (presumably from patch-package).
nodeLinker: hoisted

trustPolicy: no-downgrade
